<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小貓釣魚 · 小小遊樂園</title><link rel="stylesheet" href="../play.css"><link rel="stylesheet" href="fishing.css?v=29"><link rel="stylesheet" href="../../touch.css?v=27"><script src="../../touch.js?v=26" defer></script></head><body><main class="fishing-shell"><nav class="navigation"><a href="../../index.html">← 小小遊樂園</a><span>CAT'S FISHING DAY</span></nav><header><p class="eyebrow">海風、魚兒和小貓</p><h1>小貓釣魚</h1></header><div class="fishing-layout"><section class="sea-card"><div class="dashboard"><div>🐟 得分<strong id="score">0</strong></div><div>🏆 分頁最高<strong id="best">0</strong></div><button id="pause" aria-label="暫停" disabled>⏸</button></div><div class="energy-row"><span>❤️ 元氣</span><div id="energy" role="progressbar" aria-label="元氣" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><div id="energyFill"></div></div></div><div class="sea"><canvas id="canvas" width="720" height="600" aria-label="海洋釣魚區，可拖曳移動小貓和魚鉤"></canvas><div class="overlay" id="overlay"><div class="message"><div class="big-icon" aria-hidden="true">🐱🎣</div><h2 id="title">今天釣什麼魚？</h2><p id="intro">拖曳畫面瞄準魚兒，或按住方向按鈕。<br>魚上鉤後，按「拉竿」甩進魚簍！</p><div class="picture-rules"><span>🐟 → ❤️＋</span><span>🐡 🥫 → ❤️－</span></div><button class="primary" id="start">▶ 開始釣魚</button></div></div></div><p id="hint" class="hint" role="status">拖曳魚鉤找魚，釣到後按拉竿！</p></section><aside class="control-card"><div class="control-title"><span>🎮 小手操作區</span><button id="help" aria-label="查看圖像說明">❔</button></div><div class="dpad"><button id="up" data-direction="up" aria-label="魚鉤往上">↑</button><button id="left" data-direction="left" aria-label="小貓往左">←</button><div class="pad-center" aria-hidden="true">🎣</div><button id="right" data-direction="right" aria-label="小貓往右">→</button><button id="down" data-direction="down" aria-label="魚鉤往下">↓</button></div><button id="reel" class="primary reel" disabled><span aria-hidden="true">🎣</span><span id="reelLabel">拉竿</span></button><div class="catch-card"><strong>🐟 魚兒圖鑑</strong><div class="guide"><span>🐟 小魚 <b>＋100</b></span><span>🐠 大魚 <b>＋200</b></span><span>🦑 魷魚 <b>＋400</b></span><span>🐙 章魚 <b>＋400</b></span></div><p>好魚補元氣，河豚和垃圾扣元氣。<br>元氣用完就結束，可以再挑戰！</p></div><p class="small-note">手機直放、橫放和平板都能玩。<br>鍵盤方向鍵移動，空白鍵拉竿。</p></aside></div><footer><a href="https://game76420.github.io/fishing/" target="_blank" rel="noopener">玩法參考：經典釣魚遊戲</a> · 重新繪製插圖與觸控介面</footer></main><script src="game.js?v=29"></script></body></html>
