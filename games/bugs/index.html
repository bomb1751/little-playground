<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小小昆蟲探險家 · 小小遊樂園</title><link rel="stylesheet" href="../play.css"><link rel="stylesheet" href="bugs.css?v=31"><link rel="stylesheet" href="../../touch.css?v=27"><script src="../../touch.js?v=26" defer></script></head><body><main class="play-shell"><nav class="navigation"><a href="../../index.html">← 小小遊樂園</a><span>BUG GARDEN EXPLORER</span></nav><header><p class="eyebrow">帶著小網子，發現小世界</p><h1>小小昆蟲探險家</h1><p class="intro">在花朵、樹幹和草叢裡找昆蟲，拖曳小網子罩住牠！</p></header><div class="bug-layout"><section class="stage-card"><div class="stage-header"><strong id="location">🌼 尋找小昆蟲</strong><span id="found">0 / 8 種</span></div><div id="garden" class="garden" aria-label="花園捕蟲區，可拖曳捕蟲網捕捉昆蟲"></div><div class="net-controls"><button id="net" class="net-tool" aria-label="拖曳捕蟲網到昆蟲身上，鬆開捕捉"><span id="netIcon" aria-hidden="true"></span><span>拖曳小網子</span></button><div><strong>① 拖網子 → ② 罩住 → ③ 鬆手</strong><p id="hint" role="status">也可以直接在花園裡滑動捕蟲網。</p></div></div></section><aside class="tool-panel"><div id="observation" class="observation"><div id="portrait" class="portrait"></div><div><p class="eyebrow" id="discovery">觀察小站</p><h2 id="bugName">來找昆蟲朋友吧！</h2><p id="fact">捕到後可以放大看看，再把小昆蟲送回花園。</p></div><button id="release" class="action" hidden>🌿 看好了，放回花園</button></div><div class="panel-title"><h2>📖 我的昆蟲圖鑑</h2><span id="total">抓到 0 隻</span></div><div id="album" class="album"></div><div id="complete" class="complete-note" hidden>🎉 八種都找到了！你是昆蟲探險家！</div><button id="shuffle" class="action neutral shuffle">🌿 換一片風景</button><p class="small-note">五種風景隨機變換，每觀察三隻換一景。沒有倒數，慢慢找就好。圖鑑保存在這個分頁的 session。觀察完，把小昆蟲放回花園吧。</p></aside></div><footer>觀察小小生命，也記得輕輕對待牠。</footer></main><script src="../play.js"></script><script src="scenes.js?v=31"></script><script src="game.js?v=31"></script></body></html>
